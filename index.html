<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiQU: Bambu Lab HMS Error Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        max-width: 800px;
        width: 100%;
        overflow: hidden;
      }

      .header {
        background: #143997;
        color: white;
        padding: 30px;
        text-align: center;
      }

      .header h1 {
        font-size: 2.5em;
        margin-bottom: 10px;
        font-weight: 300;
      }

      .header p {
        opacity: 0.8;
        font-size: 1.1em;
      }

      .content {
        padding: 40px;
      }

      .error-code {
        background: #eff6ff;
        border-left: 5px solid #2563eb;
        padding: 20px;
        margin-bottom: 30px;
        border-radius: 0 8px 8px 0;
      }

      .error-code h2 {
        color: #2563eb;
        font-size: 1.8em;
        margin-bottom: 15px;
        font-weight: 600;
      }

      .error-message {
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        border-radius: 8px;
        padding: 25px;
        line-height: 1.8;
        font-size: 1.1em;
        color: #1e3a8a;
      }

      .no-error {
        text-align: center;
        padding: 40px;
        color: #1d4ed8;
      }

      .no-error h2 {
        font-size: 1.5em;
        margin-bottom: 15px;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #2563eb;
      }

      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #2563eb;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .search-section {
        background: #eff6ff;
        border-radius: 8px;
        padding: 25px;
        margin-bottom: 30px;
      }

      .search-input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #bfdbfe;
        border-radius: 6px;
        font-size: 16px;
        transition: border-color 0.3s ease;
      }

      .search-input:focus {
        outline: none;
        border-color: #2563eb;
      }

      .search-btn {
        background: #2563eb;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 15px;
        transition: background-color 0.3s ease;
      }

      .search-btn:hover {
        background: #1d4ed8;
      }

      .wiki-link {
        background: #059669;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 15px;
        margin-left: 10px;
        text-decoration: none;
        display: inline-block;
        transition: background-color 0.3s ease;
      }

      .wiki-link:hover {
        background: #047857;
        color: white;
        text-decoration: none;
      }

      .footer {
        background: #eff6ff;
        padding: 20px;
        text-align: center;
        color: #1d4ed8;
        font-size: 0.9em;
      }

      .footer a {
        color: #2563eb;
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }

      .error-level {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 16px;
        font-size: 0.85em;
        font-weight: 600;
        text-transform: uppercase;
        margin-left: 10px;
      }

      .error-level.fatal {
        background: #dc2626;
        color: white;
      }

      .error-level.serious {
        background: #ea580c;
        color: white;
      }

      .error-level.common {
        background: #d97706;
        color: white;
      }

      .error-level.info {
        background: #059669;
        color: white;
      }

      .error-level.unknown {
        background: #6b7280;
        color: white;
      }

      @media (max-width: 600px) {
        .header h1 {
          font-size: 2em;
        }

        .content {
          padding: 20px;
        }

        .error-code h2 {
          font-size: 1.5em;
        }
      }
    </style>
  </head>
  <body>

        <h1>Bambu Device Error Viewer</h1>
        <p>Bambu Lab 3D Printer Error Code Lookup</p>
      </div>

      <div class="content">
        <div class="search-section">
          <input
            type="text"
            class="search-input"
            id="ecodeInput"
            placeholder="Enter error code (e.g., 0C008015)"
          />
          <button class="search-btn" onclick="searchErrorCode()">
            Search Error Code
          </button>
        </div>

        <div id="result">
          <div class="loading">
            <div class="spinner"></div>
            <p>Loading error codes...</p>
          </div>
        </div>
      </div>

      <div class="footer">
        <p>
          Error codes sourced from
          <a href="https://github.com/bambulab/BambuStudio" target="_blank"
            >Bambu Lab Studio</a
          >
        </p>
      </div>
    </div>

    <script>
      let errorCodes = [];

      // Load error codes on page load
      async function loadErrorCodes() {
        try {
          // Load HMS error codes
          const response = await fetch("data/ecodes.json");
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const data = await response.json();

          // Get errors from data.device_error.en
          if (data.data.device_error.en) {
            const deviceErrors = Object.values(
              data.data.device_error.en
            ).filter((item) => item && typeof item === "object" && item.ecode);
            errorCodes = errorCodes.concat(deviceErrors);
          }

          // Get errors from data.device_hms.en
          if (data.data.device_hms.en) {
            const hmsErrors = Object.values(data.data.device_hms.en).filter(
              (item) => item && typeof item === "object" && item.ecode
            );
            errorCodes = errorCodes.concat(hmsErrors);
          }

          if (errorCodes.length === 0) {
            throw new Error(
              "No error codes found in device_error.en or device_hms.en"
            );
          }

          console.log("Processed errorCodes:", errorCodes);
          console.log("Number of error codes:", errorCodes.length);

          // Check for ecode in URL parameters
          const urlParams = new URLSearchParams(window.location.search);
          const ecode = urlParams.get("ecode");

          if (ecode) {
            displayError(ecode);
          } else {
            showSearchPrompt();
          }
        } catch (error) {
          console.error("Error loading HMS codes:", error);
          document.getElementById("result").innerHTML = `
                    <div class="no-error">
                        <h2>Failed to Load Error Codes</h2>
                        <p>Could not fetch error codes from the server. Please check your internet connection and try again.</p>
                        <p>Error: ${error.message}</p>
                    </div>
                `;
        }
      }

      function displayError(ecode) {
        const resultDiv = document.getElementById("result");

        // Check if errorCodes is loaded and is an array
        if (!Array.isArray(errorCodes) || errorCodes.length === 0) {
          resultDiv.innerHTML = `
            <div class="no-error">
              <h2>Error Codes Not Loaded</h2>
              <p>Please wait for the error codes to load before searching.</p>
            </div>
          `;
          return;
        }

        // Find the error by ecode
        const error = errorCodes.find(
          (item) =>
            item.ecode && item.ecode.toLowerCase() === ecode.toLowerCase()
        );

        if (error && error.intro) {
          // Hide the search section when displaying an error
          document.querySelector(".search-section").style.display = "none";

          // Parse HMS error level
          const errorLevel = parseHmsErrorLevel(ecode);

          resultDiv.innerHTML = `
            <div class="error-code">
              <h2>Error Code: ${error.ecode}
                <span class="error-level ${errorLevel.class}">${errorLevel.name}</span>
              </h2>
            </div>
            <div class="error-message">
              ${error.intro}
            </div>
          `;

          // Update page title
          document.title = `HMS Error ${error.ecode} - Bambu Lab`;

          // Set the input value
          document.getElementById("ecodeInput").value = ecode;
        } else {
          // Show the search section when error not found
          document.querySelector(".search-section").style.display = "block";

          resultDiv.innerHTML = `
                    <div class="no-error">
                        <h2>Error Code Not Found</h2>
                        <p>The error code "<strong>${ecode}</strong>" was not found in the HMS database.</p>
                        <p>Please check the code and try again. Error codes are typically alphanumeric (e.g., 0C008015).</p>
                    </div>
                `;

          // Set the input value even if not found
          document.getElementById("ecodeInput").value = ecode;
        }
      }

      // Function to parse HMS error level from error code
      function parseHmsErrorLevel(ecode) {
        try {
          // Convert ecode to 64-bit integer
          const hms = BigInt("0x" + ecode.padStart(16, "0"));

          // Extract the code portion (lower 32 bits)
          const code = Number(hms & 0xffffffffn);

          // Extract message level from upper 16 bits of code
          const msgLevel = (code >> 16) & 0xffff;

          // Map to HMS message level enum
          const HMS_LEVELS = {
            0: { name: "ERROR", class: "unknown" },
            1: { name: "FATAL", class: "fatal" },
            2: { name: "SERIOUS", class: "serious" },
            3: { name: "COMMON", class: "common" },
            4: { name: "INFO", class: "info" },
          };

          return HMS_LEVELS[msgLevel] || HMS_LEVELS[0];
        } catch (error) {
          console.error("Error parsing HMS level:", error);
          return { name: "ERROR", class: "unknown" };
        }
      }

      function showSearchPrompt() {
        // Always show the search section on the welcome screen
        document.querySelector(".search-section").style.display = "block";

        document.getElementById("result").innerHTML = `
                <div class="no-error">
                    <h2>Welcome to HMS Error Viewer</h2>
                    <p>Enter an error code in the search box above or add <code>?ecode=YOUR_CODE</code> to the URL to look up a specific error.</p>
                    <p>Example: <code>?ecode=0C008015</code></p>
                </div>
            `;
      }

      function searchErrorCode() {
        const ecode = document.getElementById("ecodeInput").value.trim();
        if (ecode) {
          // Check if error codes are loaded
          if (!Array.isArray(errorCodes) || errorCodes.length === 0) {
            document.getElementById("result").innerHTML = `
              <div class="no-error">
                <h2>Please Wait</h2>
                <p>Error codes are still loading. Please try again in a moment.</p>
              </div>
            `;
            return;
          }

          // Update URL without refreshing page
          const newUrl = new URL(window.location);
          newUrl.searchParams.set("ecode", ecode);
          window.history.pushState({}, "", newUrl);

          displayError(ecode);
        }
      }

      // Allow Enter key to trigger search
      document.addEventListener("DOMContentLoaded", function () {
        document
          .getElementById("ecodeInput")
          .addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
              searchErrorCode();
            }
          });

        // Load error codes when page loads
        loadErrorCodes();
      });

      // Handle browser back/forward buttons
      window.addEventListener("popstate", function (e) {
        const urlParams = new URLSearchParams(window.location.search);
        const ecode = urlParams.get("ecode");

        if (ecode) {
          displayError(ecode);
        } else {
          showSearchPrompt();
        }
      });
    </script>
  </body>
</html>
